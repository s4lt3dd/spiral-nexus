# sops configuration: which age keys can decrypt which secret files.
#
# Recipients are PUBLIC keys and are safe to commit. Private keys live in:
#   - your password manager + ~/.config/sops/age/keys.txt (you)
#   - the SOPS_AGE_KEY GitHub Actions secret (CI)
# Rotate by adding the new recipient, `sops updatekeys secrets/*.enc.env`,
# then removing the old one.
#
# Generate a key:  age-keygen -o ~/.config/sops/age/keys.txt
# It prints "public key: age1..." - paste that below.

creation_rules:
  - path_regex: secrets/staging\.enc\.env$
    age: >-
      REPLACE_WITH_FOUNDER_AGE_PUBLIC_KEY,
      REPLACE_WITH_CI_AGE_PUBLIC_KEY
  - path_regex: secrets/production\.enc\.env$
    age: >-
      REPLACE_WITH_FOUNDER_AGE_PUBLIC_KEY,
      REPLACE_WITH_CI_AGE_PUBLIC_KEY
