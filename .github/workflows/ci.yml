name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels the in-flight run for that PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches the `engines` range in package.json (engine-strict is on).
          node-version: 24
          cache: npm

      # .npmrc sets ignore-scripts=true, so dependency install/postinstall
      # scripts never run here either — same supply-chain posture as local dev.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` also type-checks the project (tsconfig covers test/ too).
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
